name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-commits:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check conventional commits
        run: |
          types="feat|fix|chore|docs|refactor|test|style|perf|ci|build|revert"
          pattern="^($types)(\([a-zA-Z0-9_-]+\))?: .+"
          failed=0

          for sha in $(git log --format=%H origin/main..HEAD); do
            subject=$(git log -1 --format=%s "$sha")

            # Skip merge and revert auto-commits
            case "$subject" in
              Merge\ *|Revert\ *) continue ;;
            esac

            if ! echo "$subject" | grep -Eq "$pattern"; then
              echo "BAD: $subject"
              failed=1
            fi

            if [ ${#subject} -gt 100 ]; then
              echo "TOO LONG (${#subject} chars): $subject"
              failed=1
            fi

            # Body lines max 200 chars
            line_num=0
            while IFS= read -r line; do
              line_num=$((line_num + 1))
              if [ ${#line} -gt 200 ]; then
                echo "BODY LINE TOO LONG (line $line_num, ${#line} chars) in commit $sha"
                failed=1
              fi
            done <<BODY
          $(git log -1 --format=%b "$sha")
          BODY
          done

          if [ "$failed" -eq 1 ]; then
            echo ""
            echo "One or more commits do not follow Conventional Commits."
            echo "Expected: <type>: <subject> or <type>(<scope>): <subject>"
            exit 1
          fi

  validate-branch:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          pattern="^(feat|fix|chore|docs|refactor|test|style|perf|ci|build|revert)/.+"

          if ! echo "$BRANCH" | grep -Eq "$pattern"; then
            echo "ERROR: branch '$BRANCH' does not follow the naming convention."
            echo "Expected: <type>/<description>"
            exit 1
          fi

  forbidden-files:
    name: Block secret/credential files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tracked files
        # Keep this pattern in sync with .githooks/pre-commit.
        run: |
          forbidden_pattern='(^|/)(\.env(\..+)?|\.netrc|id_rsa|id_dsa|id_ecdsa|id_ed25519|.*\.pem|.*\.key|.*\.pfx|.*\.p12|\.aws/credentials|\.aws/config)$'
          blocked=$(git ls-files | grep -Ei "$forbidden_pattern" | grep -viE '(^|/)\.env\.example$' || true)
          if [ -n "$blocked" ]; then
            echo "ERROR: secret/credential files are tracked in git:"
            echo "$blocked" | sed 's/^/  /'
            exit 1
          fi

  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Check goimports formatting
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.45.0
          bad=$(git ls-files '*.go' | xargs goimports -l)
          if [ -n "$bad" ]; then
            echo "ERROR: files not formatted with goimports:"
            echo "$bad" | sed 's/^/  /'
            exit 1
          fi

      - name: Check go.mod / go.sum are tidy
        run: |
          tidy_out=$(go mod tidy -diff 2>&1)
          tidy_exit=$?
          if [ "$tidy_exit" -eq 0 ]; then
            exit 0
          fi
          if echo "$tidy_out" | head -1 | grep -qE '^(diff |---|\+\+\+)'; then
            echo "ERROR: go.mod / go.sum are not tidy. Run 'go mod tidy' and commit the changes."
          else
            echo "ERROR: 'go mod tidy -diff' failed (likely tool or network error, not a tidy issue)."
          fi
          echo ""
          echo "$tidy_out"
          exit 1

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Run tests
        run: go test -race ./...

      - name: Build
        run: go build -o /dev/null ./cmd/api
